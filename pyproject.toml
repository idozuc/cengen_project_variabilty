[project]
name = "cengen-project"
version = "0.1.0"
description = "CeNGEN BASiCS, nuisance-adjusted clustering, and explorer workflows"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "plotly>=5.18,<7",
  "pyarrow>=14,<22",
  "PyYAML>=6,<7",
  "scipy>=1.11,<2",
  "streamlit>=1.38,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "jsonschema>=4.21,<5"]
# Versions that reproduced the manuscript panels exactly; newer umap-learn or
# numba can rotate or mirror the UMAP layouts.
figures = ["matplotlib==3.8.0", "seaborn==0.12.2", "umap-learn==0.5.12", "numba==0.59.0", "numpy==1.26.4"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
